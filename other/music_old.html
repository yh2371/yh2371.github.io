<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) — keep if you use GA -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-E00L9PT3V9"></script>
  <script>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>YH Arrangement Stash — Radio Edition</title>

  <!-- Retro-ish fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Cinzel:wght@600&family=Inter:wght@400;700&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --wood1:#5a3a25; --wood2:#7b5236; --wood3:#3f291c;
      --brass:#caa44e; --brass-d:#8b6a2c; --brass-l:#efd48b;
      --bakelite:#2a1d18; --bakelite-h:#3a2a22;
      --paper:#f3ebd7; --ink:#281d12; --ink-sub:#5b4a35;
      --shadow:0 18px 40px rgba(0,0,0,.25);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:
        radial-gradient(1200px 600px at 50% -200px, #f5efe3 0, #d9d1c7 50%, #b7b0a6 100%);
      color:var(--ink);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }

    .stage{max-width:1100px; margin:0 auto; padding:40px 18px 64px;}
    .radio{
      position:relative; border-radius:30px; padding:22px;
      box-shadow:var(--shadow);
      background: linear-gradient(145deg, var(--wood2), var(--wood1) 40%, var(--wood3));
      border:1px solid rgba(0,0,0,.3);
    }
    .radio:before{
      content:""; position:absolute; inset:10px; border-radius:24px;
      background:
        repeating-linear-gradient(8deg, rgba(255,255,255,.04) 0 12px, rgba(0,0,0,.05) 12px 24px),
        linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.18));
      pointer-events:none;
    }

    header{
      position:relative; z-index:2;
      display:flex; align-items:center; justify-content:center; gap:14px;
      margin:6px 0 18px;
    }
    .badge{
      padding:6px 14px; border-radius:999px;
      background:linear-gradient(180deg, var(--brass) 0%, var(--brass-l) 35%, var(--brass) 100%);
      color:#3b2c11; font-family: Cinzel, serif; letter-spacing:.4px; font-weight:600;
      border:1px solid var(--brass-d);
      box-shadow: inset 0 2px 0 rgba(255,255,255,.35), inset 0 -2px 0 rgba(0,0,0,.25), 0 4px 14px rgba(0,0,0,.35);
    }
    header h1{
      margin:0; font-family:"Special Elite", monospace;
      font-size: clamp(22px, 3.2vw, 34px); letter-spacing:.6px; color:#f5e8c8;
      text-shadow: 0 2px 0 rgba(0,0,0,.5);
    }
    .mascot{width:70px; height:auto; filter:sepia(.4) saturate(.9) contrast(1.05);}

    .dial{
      position:relative; z-index:2; margin:6px auto 20px; max-width:980px;
      background: linear-gradient(180deg, #e7f6ff, #b5d7ef);
      border-radius:12px; border:2px solid rgba(0,0,0,.25);
      box-shadow: inset 0 10px 18px rgba(255,255,255,.35), inset 0 -12px 18px rgba(0,0,0,.25), 0 10px 26px rgba(0,0,0,.2);
      padding:10px 12px;
    }
    .dial-scale{
      position:relative; overflow:hidden; border-radius:8px;
      background: linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,.2));
      padding:10px; border:1px solid rgba(0,0,0,.18);
    }
    .scale-line{height:2px; background:rgba(0,0,0,.25); margin:8px 0; position:relative;}
    .scale-line:before,.scale-line:after{
      content:""; position:absolute; top:-3px; width:2px; height:8px; background:rgba(0,0,0,.35);
    }
    .scale-line:before{left:0} .scale-line:after{right:0}

    .presets{
      display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:8px;
    }
    .preset{
      appearance:none; cursor:pointer; font-weight:800; letter-spacing:.2px;
      padding:10px 14px; min-width:116px; text-align:center; color:#e8dcc0;
      background: linear-gradient(180deg, var(--bakelite), #16110d);
      border:1px solid #000; border-radius:10px;
      box-shadow: inset 0 -3px 0 rgba(255,255,255,.08), inset 0 3px 0 rgba(0,0,0,.55), 0 6px 10px rgba(0,0,0,.45);
      transition: transform .05s ease, box-shadow .15s ease;
      font-family:"Special Elite", monospace;
    }
    .preset:hover{filter:brightness(1.05)}
    .preset:active{transform:translateY(2px)}
    .preset[aria-pressed="true"]{
      background: linear-gradient(180deg, #120d0a, var(--bakelite));
      outline: 2px solid var(--brass); outline-offset: 2px;
    }

    .controls{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      margin:14px auto 18px; max-width:980px;
      padding:10px 14px; border-radius:14px;
      background: repeating-linear-gradient(0deg, #1e1a17 0 8px, #2a221c 8px 16px);
      border:1px solid rgba(0,0,0,.35);
      box-shadow: inset 0 10px 24px rgba(0,0,0,.45), 0 10px 24px rgba(0,0,0,.25);
      color:#dacfb3; font-family:"Special Elite", monospace;
    }
    .plate{
      background: linear-gradient(180deg, var(--brass) 0, var(--brass-l) 40%, var(--brass) 100%);
      color:#3b2c11; padding:6px 12px; border-radius:8px;
      border:1px solid var(--brass-d);
      box-shadow: inset 0 2px 0 rgba(255,255,255,.35), inset 0 -2px 0 rgba(0,0,0,.25);
      font-weight:800; letter-spacing:.2px;
    }

    .vu{display:flex; align-items:center; gap:10px}
    .vu-label{font-size:12px; opacity:.8}
    .vu-gauge{
      position:relative; width:160px; height:18px; border-radius:10px;
      background:linear-gradient(180deg, #4b2e25, #2a1a14);
      border:1px solid #000; overflow:hidden; box-shadow: inset 0 2px 8px rgba(0,0,0,.6);
    }
    .vu-fill{
      position:absolute; left:0; top:0; bottom:0; width:0%;
      background: linear-gradient(90deg, #7ac96f, #f0c857 60%, #d66 90%);
      box-shadow:0 0 14px rgba(255,230,140,.55);
      transition: width .2s ease;
    }
    .vu.playing .vu-fill{animation:pulse 1.2s infinite ease-in-out}
    @keyframes pulse{0%{width:14%}25%{width:48%}50%{width:62%}75%{width:38%}100%{width:22%}}

    .knobs{display:flex; gap:10px}
    .knob{
      width:54px; height:54px; border-radius:50%;
      background: radial-gradient(circle at 28% 30%, #5b4739, #2b211a 60%);
      border:1px solid #0c0705;
      box-shadow: inset 0 8px 14px rgba(255,255,255,.08), inset 0 -10px 16px rgba(0,0,0,.65), 0 10px 14px rgba(0,0,0,.45);
      display:grid; place-items:center; cursor:pointer; transition:.15s ease;
    }
    .knob:disabled{filter:grayscale(.6) opacity(.6); cursor:not-allowed}
    .knob:active{transform:rotate(-6deg)}
    .knob svg{width:26px; height:26px; color:#d9caa7}

    .window{
      position:relative; z-index:2; max-width:980px; margin:0 auto;
      background:linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,.15));
      border:2px solid rgba(0,0,0,.35); border-radius:16px;
      box-shadow: inset 0 10px 26px rgba(255,255,255,.25), inset 0 -10px 26px rgba(0,0,0,.35), 0 18px 32px rgba(0,0,0,.35);
      overflow:hidden;
    }
    .glass-tint{
      position:absolute; inset:0; pointer-events:none;
      background: radial-gradient(120% 70% at 50% -10%, rgba(255,255,255,.45), transparent 60%),
                  radial-gradient(100% 80% at 50% 120%, rgba(0,0,0,.15), transparent 40%);
      mix-blend-mode: screen;
    }
    .playlist{
      position:relative; z-index:1;
      display:grid; grid-auto-flow:column; grid-auto-columns:minmax(min(90vw,820px),1fr);
      gap:18px; overflow-x:auto; padding:18px; scroll-snap-type:x mandatory;
      -webkit-overflow-scrolling:touch;
    }
    .playlist::-webkit-scrollbar{height:12px}
    .playlist::-webkit-scrollbar-thumb{background:#9f8f7b; border-radius:999px}

    .card{
      scroll-snap-align:center; background: var(--paper);
      border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:12px;
      border:1px solid #b8ad98;
      box-shadow: 0 8px 20px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.7);
      transform: rotate(-.2deg);
    }
    .title{font-family:"Special Elite", monospace; font-size:20px; margin:0; color:#1a120a}
    .meta{color:var(--ink-sub); font-size:14px}
    .meta a{color:#7a4b0e; font-weight:800; text-decoration:none}
    .meta a:hover{text-decoration:underline}

    .player{
      position:relative; overflow:hidden; border-radius:10px;
      background:#d7ceb8; height:150px; border:1px solid #c1b59d;
    }
    .player iframe{width:100%; height:100%; border:0; display:block}

    @media (min-width:1024px){
      .playlist{grid-auto-columns:minmax(420px,1fr)}
      .player{height:170px}
    }
    #clustrmaps{display:none}
  </style>
</head>
<body>
  <div class="stage">
    <div class="radio">
      <header>
        <span class="badge"><img class="mascot" src="../images/YAY.gif" alt="animated confetti"/></span>
        <h1>YH Arrangement Stash</h1>
      </header>

      <div class="dial" aria-label="Radio dial">
        <div class="dial-scale">
          <div class="scale-line"></div>
          <div class="presets" id="semesterTabs" role="tablist" aria-label="Semesters"></div>
        </div>
      </div>

      <div class="controls">
        <div class="plate" id="semesterLabel" aria-live="polite">Tuned: —</div>
        <div class="vu" id="vu">
          <span class="vu-label">VU</span>
          <div class="vu-gauge"><div class="vu-fill"></div></div>
        </div>
        <div class="knobs">
          <button class="knob" id="prevBtn" aria-label="Tune previous">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
          </button>
          <button class="knob" id="nextBtn" aria-label="Tune next">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>

      <section class="window" aria-label="Playlist window">
        <div class="glass-tint" aria-hidden="true"></div>
        <div class="playlist" id="playlist" tabindex="0" aria-label="Playlist carousel">
          <!-- Cards injected by JS -->
        </div>
      </section>
    </div>
  </div>

  <script>
    // ======= DATA (meta supports inline links via innerHTML) =================
    const DATA = {
      "Spring 2025": [
        {
          title: "平凡之路 x Something Just Like This — 朴树 x The Chainsmokers & Coldplay",
          meta: "For 8 Vocals · Penn Enchord Spring 2025 · Feeling extra ordinary. Something Just Like This inspired by <a href='https://www.youtube.com/watch?v=FZp0swZHqQA&list=RDFZp0swZHqQA' target='_blank' rel='noopener'>VoicePlay</a>.",
          src: "https://drive.google.com/file/d/13XwpsCKxMQpUtDAoXJ8VGiSIQ1Mz7ydk/preview"
        },
        {
          title: "如果爱忘了 x How Can I Love the Heartbreak, You're the One I Love... — 汪苏泷单依纯 x AKMU",
          meta: "SATB · Penn Enchord Spring 2025 · Really liked this version. Drums by <a href='https://musescore.com/user/46160387/scores/19138555' target='_blank' rel='noopener'>Sheldon_1234</a>.",
          src: "https://drive.google.com/file/d/1K_9utqrU0RBe0AUl9d6yzj2SRkzOnpEz/preview"
        },
        {
          title: "玫瑰 — 陈奕迅",
          meta: "SSATB · Penn Enchord Spring 2025 · 脑洞大开串了一点回家的诱惑哈哈哈🌹",
          src: "https://drive.google.com/file/d/17QWkXUWzfhJx2g93tjbx8RyisDUavCkR/preview"
        }
      ],
      "Fall 2024": [
        {
          title: "Put Your Records On x 这条小鱼在乎 - Corinne Bailey Rae x 王OK",
          meta: "SATB · Penn Enchord Fall 2024 · A message to myself.",
          src: "https://drive.google.com/file/d/1TquE_46bfvVLdpHzmN4V-pZW4oYR4AR6/preview"
        },
        {
          title: "Mojito - 周杰伦",
          meta: "SSATB · Penn Enchord Fall 2024 · Mixing in a ride on the Merry-Go-Round of Life & a trip to Havana.",
          src: "https://drive.google.com/file/d/10JgEnAHVEqeBp97i-n9qZou1i37GZLHa/preview"
        },
        {
          title: "海阔天空 x Hey Jude - Beyond x The Beatles",
          meta: "SATB · Penn Enchord Fall 2024 · This was a fun song.",
          src: "https://drive.google.com/file/d/1FgvTDsHzFskcueYuvJ6ec0dEWyZ0gUeF/preview"
        }
      ],
      "Spring 2024": [
        {
          title: "Hotel California — Eagles",
          meta: "SATB · Penn Enchord Spring 2024 · Inspired by <a href='https://www.youtube.com/watch?v=24R-1KtiJag' target='_blank' rel='noopener'>INNER'G Acapella</a> & <a href='https://www.youtube.com/watch?v=JnYDukUfv-s' target='_blank' rel='noopener'>CoffeetimeBand</a>",
          src: "https://drive.google.com/file/d/1t0k8QLs7DOjUUIobVizBpRihQ9JKmNPf/preview"
        },
        {
          title: "第一天 — 孙燕姿",
          meta: "SATB · Penn Enchord Spring 2024 · Inspired by <a href='https://www.youtube.com/watch?v=mHwhzdhxUEQ' target='_blank' rel='noopener'>HAcappella</a>",
          src: "https://drive.google.com/file/d/1AsS7by20dElU4up3CYzMCXSXPqd3BjK0/preview"
        }
      ],
      "Fall 2023": [
        {
          title: "Taylor Swift Medley",
          meta: "SATB · Penn Enchord Fall 2023 · Anti-Hero inspired by <a href='https://www.youtube.com/shorts/OvnssR4zZF4' target='_blank' rel='noopener'>VoicePlay</a>",
          src: "https://drive.google.com/file/d/1aNfVj2_n8xl0yVcZWoZ5mn9l59CWn6QJ/preview"
        },
        {
          title: "Flowers × When I Was Your Man × WANNABE - Miley Cyrus x Bruno Mars x ITZY",
          meta: "SATB · Penn Enchord Fall 2023 · Inspired by <a href='https://www.youtube.com/watch?v=FESkz64l7VM' target='_blank' rel='noopener'>Pomplamoose</a>",
          src: "https://drive.google.com/file/d/1YRb8oeuHrxfBep0SrRsRsCyfFJVoc5KQ/preview"
        }
      ],
      "Spring 2023": [
        {
          title: "僕が死のうと思ったのは — 中島美嘉",
          meta: "SATB · Penn Enchord Spring 2023",
          src: "https://drive.google.com/file/d/1xwMhp6BA0-lsFoUeyMgBomwRpkvfrTDD/preview"
        }
      ]
    };

    // ======= App logic ======================================================
    const order = ["Spring 2025", "Fall 2024", "Spring 2024", "Fall 2023", "Spring 2023"];
    const semesters = order.filter(s => DATA[s]).concat(Object.keys(DATA).filter(s=>!order.includes(s)));
    const qs = new URLSearchParams(location.search);
    let currentSemester = decodeURIComponent(qs.get("semester") || semesters[0]);

    const tabsEl = document.getElementById('semesterTabs');
    const labelEl = document.getElementById('semesterLabel');
    const listEl = document.getElementById('playlist');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const vuEl = document.getElementById('vu');

    function setSelected(sem){
      currentSemester = sem;
      history.replaceState(null,"",`${location.pathname}?semester=${encodeURIComponent(sem)}`);
      renderTabs(); renderPlaylist();
    }

    function renderTabs(){
      tabsEl.innerHTML = "";
      semesters.forEach((sem) => {
        const b = document.createElement('button');
        b.className = 'preset';
        b.setAttribute('role','tab');
        b.setAttribute('aria-pressed', String(sem === currentSemester));
        b.textContent = sem;
        b.addEventListener('click', () => setSelected(sem));
        tabsEl.appendChild(b);
      });
      labelEl.textContent = `Tuned: ${currentSemester}`;
    }

    function renderPlaylist(){
      listEl.innerHTML = "";
      const items = DATA[currentSemester] || [];
      items.forEach((it) => {
        const card = document.createElement('article');
        card.className = 'card';
        card.setAttribute('aria-label', it.title);

        const h = document.createElement('h3'); h.className = 'title'; h.textContent = it.title;

        const meta = document.createElement('div'); meta.className = 'meta';
        // IMPORTANT: allow inline links in meta
        meta.innerHTML = it.meta || '';

        const player = document.createElement('div');
        player.className = 'player';
        player.dataset.src = it.src;

        player.addEventListener('mouseenter',()=> vuEl.classList.add('playing'));
        player.addEventListener('mouseleave',()=> vuEl.classList.remove('playing'));

        card.append(h, meta, player);
        listEl.appendChild(card);
      });

      setupLazyPlayers();
      listEl.scrollTo({left:0, behavior:'instant'});
      updateArrows();
    }

    function setupLazyPlayers(){
      const players = [...document.querySelectorAll('.player')];
      const makeIframe = (el) => {
        if (el.dataset.loaded) return;
        const ifr = document.createElement('iframe');
        ifr.allow = "autoplay";
        ifr.title = "Score Preview";
        ifr.loading = "lazy";
        ifr.src = el.dataset.src;
        el.appendChild(ifr);
        el.dataset.loaded = "1";
      };
      if ('IntersectionObserver' in window){
        const io = new IntersectionObserver((entries) => {
          entries.forEach(e => { if (e.isIntersecting) { makeIframe(e.target); io.unobserve(e.target); } });
        }, {root:listEl, rootMargin:"150px", threshold:.2});
        players.forEach(p => io.observe(p));
      } else { players.forEach(makeIframe); }
    }

    function cardWidth(){ const c = listEl.querySelector('.card'); return c ? (c.getBoundingClientRect().width + 18) : 480; }
    function scrollByCard(dir){ listEl.scrollBy({left: cardWidth()*dir, behavior:'smooth'}); }
    prevBtn.addEventListener('click', ()=>scrollByCard(-1));
    nextBtn.addEventListener('click', ()=>scrollByCard(1));

    function updateArrows(){
      const max = listEl.scrollWidth - listEl.clientWidth - 4;
      prevBtn.disabled = listEl.scrollLeft <= 2;
      nextBtn.disabled = listEl.scrollLeft >= max;
    }
    listEl.addEventListener('scroll', updateArrows, {passive:true});
    window.addEventListener('resize', updateArrows);

    listEl.addEventListener('keydown', (e)=>{
      if (e.key === 'ArrowRight'){ e.preventDefault(); scrollByCard(1); }
      if (e.key === 'ArrowLeft'){ e.preventDefault(); scrollByCard(-1); }
    });

    if (!semesters.includes(currentSemester)) currentSemester = semesters[0];
    renderTabs(); renderPlaylist();
  </script>

  <script id="clustrmaps" src="//clustrmaps.com/map_v2.js?d=rA5dLa2Esjc-eYfBRXaZd1LZ84GBrEH5rGo9tQJSbwA&cl=ffffff&w=0"></script>
</body>
</html>
